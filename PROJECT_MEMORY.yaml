project:
  name: HA Kraken Trader
  platform: Home Assistant OS auf Laptop
  target: Vollautomatische auditierbare Kraken-Analyse mit Realportfolio, Paper-Trading, später kontrolliertem Realhandel und österreichischer Steueraufbereitung.
  delivery: Jede Version als vollständiges GitHub-Repository inklusive vollständigem Project Memory.
non_negotiable_rules:
  - Keine bestehende Funktion ungefragt entfernen oder einschränken.
  - Änderungen testen und Memory, Feature Contract, Test Matrix, Handover und append-only Ledgers aktualisieren.
  - Keine Secrets in Repository, GUI, Audit oder Export.
  - KI darf niemals unmittelbar handeln; Risiko- und Freigaberegeln bleiben deterministisch.
  - Bei fehlenden, veralteten oder widersprüchlichen Daten keine reale Order.
  - Realhandel und Margin bleiben getrennt, mehrstufig und standardmäßig deaktiviert.
current_release:
  version: 0.1.0-dev.2
  status: testbarer Read-only-Entwicklungsstand
  implemented:
    - Home-Assistant-Ingress-kompatible Navigation über X-Ingress-Path
    - funktionierende Tabs Übersicht, API, Portfolio, Musterdepot, Audit, Einstellungen und Export
    - öffentliche Kraken-System- und Instrumentenabfrage
    - private read-only Balance- und Ledger-Abfrage
    - API-Status, letzter Fehler und Synchronisierungszeitpunkt in der GUI
    - persistente SQLite-Datenbank unter /data
    - Paper-EUR-Startsaldo
    - Produktfreigaben und Analyse-/Paper-Kill-Switch
    - Audit- und Ledger-CSV
    - Realhandel serverseitig nicht implementiert und hart deaktiviert
  preserved_from_dev_1:
    - Ingress-GUI
    - Kraken-REST-Signierung
    - SQLite-Persistenz
    - Paper-Wallet
    - Audit
    - Einstellungen
    - CSV-Exporte
known_limits:
  - Portfolio zeigt Rohmengen ohne EUR-Bewertung.
  - Ledger importiert derzeit die erste von Kraken gelieferte Seite; Pagination folgt.
  - Kein automatischer Scheduler; Synchronisierung wird in der GUI ausgelöst.
  - Keine Orderausführung und keine simulierten Trades.
problems_and_solutions:
  - problem: Absolute Flask-Links verließen den HA-Ingress; Tabs ergaben 404 und Dashboard führte zum HA-Dashboard.
    cause: url_for erzeugte Root-Pfade ohne den dynamischen Ingress-Präfix.
    solution: WSGI-Middleware übernimmt X-Ingress-Path als SCRIPT_NAME; alle Navigationen und Redirects verwenden url_for.
next_steps:
  - Installation von dev.2 auf HA OS bestätigen
  - Private API-Verbindung und Rohportfolio praktisch testen
  - Kraken-Symbole normalisieren und Portfolio in EUR bewerten
  - Ledger-Pagination und vollständige Historie ergänzen
  - Paper-Broker mit Gebühren, Spread und Slippage entwickeln
