schema_version: 2
project:
  name: HA Kraken Trader
  platform: Home Assistant OS auf Laptop
  target: Vollautomatische auditierbare Kraken-Analyse mit Realportfolio, Paper-Trading, spaeter kontrolliertem Realhandel und oesterreichischer Steueraufbereitung.
  delivery: Jede Version als vollstaendiges GitHub-Repository mit vollstaendigem Project Memory.
non_negotiable_rules:
  - Bestehende Funktionen nie ungefragt entfernen oder einschraenken.
  - Aenderungen testen; Feature Contract, Test Matrix, Handover und append-only Ledgers aktualisieren.
  - Keine Secrets, WebSocket-Tokens oder Rohschluessel in GUI, Audit oder Export.
  - KI darf niemals unmittelbar handeln.
  - Bei fehlenden oder widerspruechlichen Daten keine reale Order.
  - Realhandel und Margin bleiben getrennt, mehrstufig und standardmaessig deaktiviert.
current_release:
  version: 0.1.0-dev.43
  status: Zielzeitgenaue historische Prognoseauswertung und quellenbezogene Kostenkette; 119 Tests erfolgreich
implemented:
  - Ingress-GUI mit Uebersicht, API, Portfolio, Musterdepot, Audit, Einstellungen und Export
  - Kraken-REST-Signierung und sichere Secret-Konfiguration unter /data/options.json
  - Read-only Balance und vollstaendig paginierter Ledgerimport
  - Asset- und Paar-Metadaten sowie EUR-Tickerbewertung
  - Persistente Portfolio-Assets und unveraenderliche Snapshots
  - Historische Nullpositionen aus der Ledger-Historie
  - Fail-closed Qualitaetsstatus INCOMPLETE bei nicht bewertbaren gehaltenen Assets
  - WebSocket-Berechtigungstest ueber REST GetWebSocketsToken ohne Speicherung oder Anzeige des Tokens
  - Oeffentlicher Kraken Spot WebSocket v2 Tickerstream fuer aktuell gehaltene EUR-Assets
  - Persistente Live-Preise mit Bid Ask Last und Empfangszeit
  - Statuskanal, Heartbeat-Frische, Stale-Erkennung und exponentieller Reconnect bis 30 Sekunden
  - REST bleibt kanonisch fuer Portfolio-Snapshots und Reconciliation
  - Privater read-only WebSocket v2 fuer Balances und Executions
  - Frischer kurzlebiger Authentifizierungstoken pro Verbindung; keine Tokenpersistenz
  - Kanalgetrennte Sequenzkontrolle, Gap-Audit, DEGRADED-Zustand und Reconnect mit neuem Snapshot
  - Execution-Ereignisse werden idempotent anhand eindeutiger Ausfuehrungs- oder Ereignisschluessel gespeichert
  - Paper-Wallet, Kill-Switch, Allowlist, Audit und CSV-Exporte
  - Realhandel serverseitig nicht implementiert
websocket_decision:
  public_market_data: keine API-Berechtigung erforderlich; spaeter WebSocket v2
  private_account_data: Kraken-Berechtigung Access WebSockets API erforderlich
  current_usage: oeffentlicher Ticker sowie private read-only Balances und Executions aktiv; keine Ordermethoden
  architecture: REST bleibt fuer Snapshots, Historie, Reconciliation und Tokenbezug erhalten
known_limits:
  - Private Ausfuehrungsereignisse sind read-only und keine Steuerberechnung
  - Kein automatischer Scheduler
  - Keine simulierten Trades in diesem Kraken-Projektstand
  - Keine echten Orders
  - Direkte EUR-Bewertung; Cross-Rates folgen spaeter
problems_and_solutions:
  - problem: Ehemals gehaltene Assets fehlen im aktuellen Balance-Endpunkt
    solution: Vereinigung aus aktuellem Balancebestand und allen Ledger-Assets; Menge 0 wird HISTORICAL_ZERO
  - problem: Teilhistorie durch erste Ledger-Seite
    solution: Pagination ueber ofs bis Kraken count erreicht ist
  - problem: Fehlender EUR-Markt koennte falschen Gesamtwert erzeugen
    solution: Kein Schaetzwert; Snapshot wird INCOMPLETE und unbewertete Anzahl gespeichert
next_steps:
  - HA-OS-Test der privaten Balance- und Execution-Streams sowie Sequenzen nach Neustart
  - Kostenbasis, realisierte und unrealisierte Ergebnisse aus Ledger und Executions
  - Realisierte/unrealisierte Ergebnisse und steuerliche Kostenbasis

release_0_1_0_dev_6:
  date: 2026-08-23
  purpose: Erster funktionsfähiger Paper-Broker und nachvollziehbare regelbasierte Baseline.
  preserved:
    - Vollständige Portfoliohistorie und Ledger-Pagination
    - Öffentlicher und privater read-only WebSocket v2
    - Sequenzkontrolle, Reconnect und Datenqualitätszustände
    - Ingress-GUI, Echtportfolio, Audit, Allowlist und Exporte
    - Realhandel weiterhin technisch nicht implementiert
  added:
    - Eigenständiges Paper-Konto mit persistentem EUR-Cash
    - Persistente Paper-Positionen, Trades, Entscheidungen und Snapshots
    - Gebühren- und Slippage-Simulation mit separaten Ausweisen je Trade
    - Positionslimit bezogen auf den aktuellen Paper-Gesamtwert
    - Deterministische Momentum-Baseline für ausschließlich freigegebene Produkte
    - BUY ab plus 1 Prozent 24h, SELL ab minus 1.5 Prozent 24h
    - Ausführung nur bei aktivierter Analyse-/Paper-Automatik und LIVE-Daten
    - GUI-Seiten Musterdepot und Paper-Entscheidungen
    - Jede Entscheidung enthält Aktion, Score, Datenqualität, Ausführungsstatus und Begründung
  configuration:
    paper_fee_bps: Standard 40 Basispunkte; transparent konfigurierbar
    paper_slippage_bps: Standard 10 Basispunkte; transparent konfigurierbar
    paper_max_position_pct: Standard 10 Prozent
    paper_trade_eur: Standard 25 EUR
  known_limits:
    - Baseline ist kein trainiertes Modell und keine Gewinnzusage.
    - Die Gebühreneinstellung ist eine konservative Simulation und noch nicht kontospezifisch aus GetTradeVolume bezogen.
    - Strategie wird in dieser Version bewusst über die GUI ausgelöst, nicht zeitgesteuert.
    - Kraken-Mindestordergrößen werden im Paper-Broker noch nicht je Instrument angewendet.
  next_steps:
    - Praktischen HA-Test des Paper-Brokers durchführen
    - AssetPairs-Mindestgrößen und kontospezifische Gebühren einbinden
    - Backtest-Datenspeicher und Benchmark entwickeln
    - Scanner um Liquidität, Spread, Volatilität und Trend erweitern

release_0_1_0_dev_7:
  date: 2026-08-23
  purpose: Paper-Konfiguration sichtbar machen und den Automatismus tatsächlich periodisch ausführen.
  user_observations:
    - Musterdepot und Entscheidungsseite waren vorhanden.
    - Paper-Konfiguration war in der App-GUI nicht auffindbar.
    - Es wurde kein simulierter Kauf ausgeführt.
  root_causes:
    - Paper-Parameter waren primär Home-Assistant-App-Optionen und nicht vollständig in der Ingress-GUI dargestellt.
    - Der öffentliche WebSocket beobachtete zuvor hauptsächlich real gehaltene Assets, nicht zuverlässig alle Paper-Allowlist-Produkte.
    - Die Paper-Strategie lief nur nach manuellem Klick und nicht periodisch.
    - BUY bleibt korrekt signalabhängig; ohne +1 Prozent 24h-Signal soll kein Kauf erzwungen werden.
  fixes:
    - Vollständige Paper-Konfiguration im Tab Einstellungen: Aktivierung, Intervall, Orderwert, Positionslimit, Gebühr und Slippage.
    - Produkt-Checkboxen für BTC/EUR, ETH/EUR, SOL/EUR, ADA/EUR und XRP/EUR; gespeicherte Produkte werden abonniert.
    - Allowlist-Produkte werden nach dem Speichern an den öffentlichen WebSocket übergeben.
    - Vor jedem Paper-Lauf werden Preise zusätzlich per öffentlichem REST-Ticker aktualisiert.
    - Hintergrund-Scheduler führt den Paper-Lauf im konfigurierten Intervall aus.
    - Manueller Lauf nutzt dieselbe Preisaktualisierung und dieselbe Engine wie der Scheduler.
    - Konfiguration wird persistent in SQLite gespeichert und ohne App-Neustart angewendet.
  safety:
    - Ein BUY wird weiterhin nicht erzwungen; Schwelle bleibt +1 Prozent 24h.
    - Ohne aktivierte Paper-Automatik, Allowlist oder aktuelle Preise gibt es keinen simulierten Trade.
    - Realhandel bleibt technisch nicht implementiert.
  tests:
    automated_passed: 17
    coverage_added:
      - Konfigurationsfelder sichtbar und persistent
      - Allowlist-Speicherung
      - REST-Preis-Fallback für BTC/EUR

release_0_1_0_dev_8:
  date: 2026-08-23
  purpose: Statistischer Markt-Scanner als Grundlage für fundiertere automatische Entscheidungen.
  preserved:
    - Alle Funktionen und Sicherheitsgrenzen aus dev.7
    - Persistenter Paper-Broker und Scheduler
    - Öffentliche/private read-only WebSockets, Portfoliohistorie und Ledger-Pagination
    - Realhandel weiterhin nicht implementiert
  added:
    - Neue GUI-Seite Scanner
    - Abruf und persistenter Cache von Kraken-OHLC-Daten
    - Ausschließliche Nutzung abgeschlossener Kerzen; laufende Kerze wird verworfen
    - Statistische Kennzahlen für 24h-Momentum, SMA10/SMA30-Trend, Volatilität, Spread und Quotevolumen
    - Reproduzierbarer Score von 0 bis 100 und Signale BUY, HOLD, AVOID
    - Datenqualitätsstatus VALID, INSUFFICIENT oder ERROR
    - Persistente Scanner-Läufe und Ergebnisse mit vollständigen Gründen
  model_baseline:
    interval_minutes: 60
    minimum_committed_candles: 30
    buy_gate: Score mindestens 65, positives Momentum, positiver Trend und Spread höchstens 0.8 Prozent
    avoid_gate: Score unter 35 oder Spread über 1.5 Prozent
    note: Baseline ist transparent und noch nicht direkt mit der Paper-Ausführung gekoppelt.
  next_steps:
    - Praktischen Scanner-Lauf auf HA OS prüfen
    - Scanner-Score kontrolliert mit Paper-Entscheidungen verbinden
    - Kraken AssetPairs Mindestgrößen und Gebührenstaffeln integrieren
    - Backtest und Benchmark für die Baseline erstellen

