project:
  name: HA Kraken Trader
  target: Vollautomatische, auditierbare Kraken-Analyse mit Realportfolio, Paper-Trading, spaeter kontrolliertem Realhandel und oesterreichischer Steueraufbereitung.
  platform: Home Assistant OS auf Laptop
  delivery: Jede Version als vollstaendiges GitHub-Repository
non_negotiable_rules:
  - Keine bestehende Funktion ungefragt entfernen oder einschraenken.
  - Jede Aenderung testen und in Memory, Feature Contract, Test Matrix und Ledgers dokumentieren.
  - Keine Secrets im Repository oder Log.
  - Bei fehlenden, veralteten oder widerspruechlichen Daten keine reale Order.
  - KI darf nicht unmittelbar handeln; deterministische Risiko- und Freigaberegeln bleiben zwingend.
  - Realhandel und Margin sind getrennt, mehrstufig sowie standardmaessig deaktiviert.
current_release:
  version: 0.1.0-dev.1
  status: erster testbarer Entwicklungsstand
  implemented:
    - Home-Assistant-App-Struktur mit Ingress-Weboberflaeche
    - SQLite-Persistenz unter /data
    - Kraken REST Signierung fuer read-only Balance und Ledger
    - oeffentlicher Kraken-Systemstatus und AssetPairs-Abfrage
    - reales Portfolio als Rohbestandsanzeige
    - lokales Paper-Wallet mit EUR-Startsaldo
    - Audit-Log
    - Konfigurationsseite mit globalem Automatik-Stopp und Produkt-Checkboxen
    - Realhandel serverseitig hart gesperrt
    - CSV-Export fuer Audit und Ledger-Rohdaten
  not_implemented:
    - automatische Strategie und simulierte Orders
    - historische Portfoliobewertung in EUR
    - Nachrichtenquellen und KI-Modell
    - echte Orderausfuehrung
    - steuerliche Lot-Berechnung und Jahresbericht
architecture:
  backend: Python Flask
  database: SQLite WAL
  frontend: serverseitige HTML-Oberflaeche ohne externe CDN-Abhaengigkeiten
  kraken: REST API, Decimal-Werte als Strings erhalten
  storage: /data/kraken_trader.db
security:
  v0_1_real_trading: hard_disabled
  key_guidance: Nur Query Funds und Query Ledger Entries; keine Withdraw-/Deposit-/Orderrechte.
  secret_handling: Home-Assistant-App-Optionen; niemals ausgeben oder protokollieren.
known_limits:
  - Kraken-Assets werden in dieser Version noch nicht automatisch in EUR bewertet.
  - Ledger-Synchronisation importiert die jeweils neuesten von Kraken gelieferten Eintraege; Pagination folgt.
  - Keine Steuerberatung; Export ist eine nachvollziehbare Datengrundlage.
next_steps:
  - Installation und Ingress auf Zielsystem bestaetigen
  - Read-only-Kraken-Verbindung mit echtem Kleinstportfolio testen
  - Symbolnormalisierung und EUR-Bewertung ergaenzen
  - Paper-Broker mit Gebuehr, Spread und Slippage implementieren
  - Scanner mit Datenqualitaets-Gates entwickeln
