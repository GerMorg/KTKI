schema_version: 2
project:
  name: HA Kraken Trader
  platform: Home Assistant OS auf Laptop
  target: Vollautomatische auditierbare Kraken-Analyse mit Realportfolio, Paper-Trading, spaeter kontrolliertem Realhandel und oesterreichischer Steueraufbereitung.
  delivery: Jede Version als vollstaendiges GitHub-Repository mit vollstaendigem Project Memory.
non_negotiable_rules:
  - Bestehende Funktionen nie ungefragt entfernen oder einschraenken.
  - Aenderungen testen; Feature Contract, Test Matrix, Handover und append-only Ledgers aktualisieren.
  - Keine Secrets, WebSocket-Tokens oder Rohschluessel in GUI, Audit oder Export.
  - KI darf niemals unmittelbar handeln.
  - Bei fehlenden oder widerspruechlichen Daten keine reale Order.
  - Realhandel und Margin bleiben getrennt, mehrstufig und standardmaessig deaktiviert.
current_release:
  version: 0.1.0-dev.18
  status: read-only Kraken-Integration mit oeffentlichem und privatem WebSocket v2; HA-OS-Praxistest fuer dev.5 ausstehend
implemented:
  - Ingress-GUI mit Uebersicht, API, Portfolio, Musterdepot, Audit, Einstellungen und Export
  - Kraken-REST-Signierung und sichere Secret-Konfiguration unter /data/options.json
  - Read-only Balance und vollstaendig paginierter Ledgerimport
  - Asset- und Paar-Metadaten sowie EUR-Tickerbewertung
  - Persistente Portfolio-Assets und unveraenderliche Snapshots
  - Historische Nullpositionen aus der Ledger-Historie
  - Fail-closed Qualitaetsstatus INCOMPLETE bei nicht bewertbaren gehaltenen Assets
  - WebSocket-Berechtigungstest ueber REST GetWebSocketsToken ohne Speicherung oder Anzeige des Tokens
  - Oeffentlicher Kraken Spot WebSocket v2 Tickerstream fuer aktuell gehaltene EUR-Assets
  - Persistente Live-Preise mit Bid Ask Last und Empfangszeit
  - Statuskanal, Heartbeat-Frische, Stale-Erkennung und exponentieller Reconnect bis 30 Sekunden
  - REST bleibt kanonisch fuer Portfolio-Snapshots und Reconciliation
  - Privater read-only WebSocket v2 fuer Balances und Executions
  - Frischer kurzlebiger Authentifizierungstoken pro Verbindung; keine Tokenpersistenz
  - Kanalgetrennte Sequenzkontrolle, Gap-Audit, DEGRADED-Zustand und Reconnect mit neuem Snapshot
  - Execution-Ereignisse werden idempotent anhand eindeutiger Ausfuehrungs- oder Ereignisschluessel gespeichert
  - Paper-Wallet, Kill-Switch, Allowlist, Audit und CSV-Exporte
  - Realhandel serverseitig nicht implementiert
websocket_decision:
  public_market_data: keine API-Berechtigung erforderlich; spaeter WebSocket v2
  private_account_data: Kraken-Berechtigung Access WebSockets API erforderlich
  current_usage: oeffentlicher Ticker sowie private read-only Balances und Executions aktiv; keine Ordermethoden
  architecture: REST bleibt fuer Snapshots, Historie, Reconciliation und Tokenbezug erhalten
known_limits:
  - Private Ausfuehrungsereignisse sind read-only und keine Steuerberechnung
  - Kein automatischer Scheduler
  - Keine simulierten Trades in diesem Kraken-Projektstand
  - Keine echten Orders
  - Direkte EUR-Bewertung; Cross-Rates folgen spaeter
problems_and_solutions:
  - problem: Ehemals gehaltene Assets fehlen im aktuellen Balance-Endpunkt
    solution: Vereinigung aus aktuellem Balancebestand und allen Ledger-Assets; Menge 0 wird HISTORICAL_ZERO
  - problem: Teilhistorie durch erste Ledger-Seite
    solution: Pagination ueber ofs bis Kraken count erreicht ist
  - problem: Fehlender EUR-Markt koennte falschen Gesamtwert erzeugen
    solution: Kein Schaetzwert; Snapshot wird INCOMPLETE und unbewertete Anzahl gespeichert
next_steps:
  - HA-OS-Test der privaten Balance- und Execution-Streams sowie Sequenzen nach Neustart
  - Kostenbasis, realisierte und unrealisierte Ergebnisse aus Ledger und Executions
  - Realisierte/unrealisierte Ergebnisse und steuerliche Kostenbasis

