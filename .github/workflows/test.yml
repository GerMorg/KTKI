name: Autonomous Kraken Trader tests

on:
  push:
    branches:
      - main
      - 'rebuild/**'
      - 'repair/**'
      - 'fix/**'
      - 'v[0-9]*'
      - 'v*-*'
      - 'completion/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kraken_trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: sh run_tests.sh
