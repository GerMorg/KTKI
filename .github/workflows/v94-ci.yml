name: KTKI v94 CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'v94-*'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r kraken_trader/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q kraken_trader/app kraken_trader/tests
      - name: Run unit tests
        working-directory: kraken_trader
        run: python -m unittest discover -s tests -p 'test_*.py' -v
