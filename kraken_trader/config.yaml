name: Kraken Trader
version: 0.1.0-dev.103
slug: kraken_trader
description: Autonomous Kraken Portfolio, Paper-Trading und streng freigegebener Realhandel
arch:
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-line
panel_title: Kraken Trader

# Bewusst kleine HA-Konfiguration. Technische Defaults, Markt-/Order-Gates,
# Margin und interne Lernparameter bleiben im Code und in der Laufzeitdiagnose.
options:
  kraken_api_key: ''
  kraken_api_secret: ''

  paper_start_eur: 1000
  paper_enabled: true

  decision_max_position_pct: 15
  decision_cash_reserve_pct: 20
  decision_min_trade_eur: 5
  decision_max_trade_eur: 10

  ai_news_enabled: true
  ai_api_key: ''

  real_trading_enabled: false
  real_execute_enabled: false
  real_kill_switch: true
  real_allowed_symbols: ''

  automation_enabled: true
  automation_interval_minutes: 5

schema:
  kraken_api_key: password?
  kraken_api_secret: password?

  paper_start_eur: float
  paper_enabled: bool

  decision_max_position_pct: float(0.1,100)
  decision_cash_reserve_pct: float(0,100)
  decision_min_trade_eur: float(0,1000000)
  decision_max_trade_eur: float(0.01,1000000)

  ai_news_enabled: bool
  ai_api_key: password?

  real_trading_enabled: bool
  real_execute_enabled: bool
  real_kill_switch: bool
  real_allowed_symbols: str?

  automation_enabled: bool
  automation_interval_minutes: int(1,60)
