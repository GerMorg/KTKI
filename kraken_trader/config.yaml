name: Kraken Trader
version: "0.1.0-dev.7"
slug: kraken_trader
description: Read-only Kraken Portfolio und lokales Paper-Trading
arch: [amd64]
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-line
panel_title: Kraken Trader
options: {kraken_api_key: "", kraken_api_secret: "", paper_start_eur: 1000, refresh_minutes: 15, public_websocket_enabled: true, websocket_stale_seconds: 30, private_websocket_readonly_enabled: true, paper_fee_bps: 40, paper_slippage_bps: 10, paper_max_position_pct: 10, paper_trade_eur: 25, paper_interval_minutes: 15}
schema:
  kraken_api_key: password?
  kraken_api_secret: password?
  paper_start_eur: float
  refresh_minutes: int(1,1440)
  public_websocket_enabled: bool
  websocket_stale_seconds: int(10,300)
  private_websocket_readonly_enabled: bool
  paper_fee_bps: int(0,500)
  paper_slippage_bps: int(0,500)
  paper_max_position_pct: int(1,100)
  paper_trade_eur: float
  paper_interval_minutes: int(1,1440)
