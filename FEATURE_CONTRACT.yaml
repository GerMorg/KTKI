# KTKI v103 — aktueller Feature-Vertrag
v103:
  runtime:
    entrypoint: v103_main:app
    version: 0.1.0-dev.103
    single_active_runtime: true
    public_market_service: market_feed_v102
  gui:
    pages:
      - /
      - /markt
      - /analyse
      - /portfolio
      - /handel
      - /lernen
      - /real-trading
      - /system
      - /steuerinfo-at
    legacy_gui_urls_redirect: true
    machine_interfaces:
      - /health
      - /api/market
      - /api/process
      - /tax-info.zip
      - /tax-info.csv
  process:
    stages:
      - market
      - news
      - analysis
      - learning
      - canonical_plan
      - execution
      - evidence
    paper_real_same_plan: true
    shared_execution_intent: true
  market:
    public_credentials_required: false
    rest_snapshot: true
    websocket_ticker: true
    pair_normalization: true
  real_trading:
    global_enable: configurable
    kill_switch: required
    explicit_manual_arm: required
    automatic_execution_gate: required
    kraken_preflight: required
    audit_trail: required
  learning:
    explicit_activation: true
    automatic_parameter_activation: false
  quality:
    austrian_tax_help_current: true
    gui_actions_have_current_endpoints: true
    ci_required: true
