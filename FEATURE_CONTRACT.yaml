# KTKI v100 — aktueller Feature-Vertrag
v100:
  runtime:
    entrypoint: v100_main:app
    version: 0.1.0-dev.100
    single_active_runtime: true
    obsolete_runtime_wrappers: deleted
  gui:
    centralized_shell: true
    unified_real_state: true
    active_routes:
      - /
      - /analyse
      - /portfolio
      - /handel
      - /lernen
      - /diagnose
      - /prozess
      - /automatik
      - /real-trading
      - /steuerinfo-at
  configuration:
    user_controls:
      - kraken_api_key
      - kraken_api_secret
      - paper_start_eur
      - paper_enabled
      - decision_max_position_pct
      - decision_cash_reserve_pct
      - decision_min_trade_eur
      - decision_max_trade_eur
      - ai_news_enabled
      - ai_api_key
      - real_trading_enabled
      - real_execute_enabled
      - real_kill_switch
      - real_allowed_symbols
      - automation_enabled
      - automation_interval_minutes
  decision_pipeline:
    canonical_plan: true
    shared_paper_real_plan: true
    shared_execution_intent: true
    risk_reduction_without_new_entry_edge: true
  real_trading:
    global_enable: configurable
    kill_switch: required
    explicit_manual_arm: required_for_manual_live_order
    automation_gate: required_for_automatic_execution
    kraken_preflight: required
    order_limits: required
    balance_checks: required
    audit_trail: required
  learning:
    explicit_activation: true
    automatic_parameter_activation: false
  news:
    signed_time_decay_feature: true
    market_linking: true
  portfolio:
    paper_positions: true
    real_positions: true
    margin_positions: true
  quality:
    utf8: required
    ci: required
