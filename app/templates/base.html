<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Kraken Trader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand"><strong>Kraken Trader</strong><span>v{{ app_version }}</span></div>
    <div class="safety"><span class="safety-dot"></span>Realhandel ist standardmäßig blockiert</div>
  </header>
  <nav class="nav" aria-label="Hauptprozess">
    {% for href,label in nav %}
      <a href="{{ href }}" class="{% if current_path==href %}active{% endif %}" {% if current_path==href %}aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>
  <main class="main">{{ body|safe }}</main>
</div>
</body>
</html>
